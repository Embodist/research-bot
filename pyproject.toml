[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-bot"
version = "0.1.0"
description = "Headless deep-research agent for embodied AI, VLA, kinematics, C++ and ROS2 — built around the bytedance/deer-flow harness (submodule) with local skills, multi-source web search, daily email delivery and report archives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Embodist" }]
keywords = ["deep-research", "agent", "embodied-ai", "vla", "ros2", "robotics", "deer-flow"]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional: drive the upstream DeerFlow harness as the execution engine.
# Heavier install; only needed for `rb run --engine deerflow`.
deerflow = []
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
rb = "research_bot.cli:main"
research-bot = "research_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_bot"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
