name: music-audio
title: 音乐与音频算法（Music & Audio：MIR / 生成 / 理解 / 分离）
description: 追踪音乐信息检索（MIR）、音乐生成、音乐理解、歌声转换（SVC）、音源分离、翻唱识别（CSI）、自监督音频表征等的经典与前沿。
keywords:
  - music information retrieval
  - MIR
  - music generation
  - text-to-music
  - music understanding
  - singing voice conversion
  - SVC
  - music source separation
  - cover song identification
  - CSI
  - beat tracking
  - chord recognition
  - audio representation learning
  - neural audio codec
venues:
  - ISMIR
  - ICASSP
  - Interspeech
  - NeurIPS (audio)
  - IEEE/ACM TASLP
seed_queries:
  - "music information retrieval survey 2025 ISMIR"
  - "text to music generation diffusion transformer 2025"
  - "music understanding foundation model 2025"
  - "singing voice conversion SVC zero-shot 2025"
  - "music source separation benchmark 2025"
  - "cover song identification CSI deep learning 2025"
  - "self-supervised audio representation learning 2025"
  - "音乐生成 音源分离 歌声转换 翻唱识别 2025"
