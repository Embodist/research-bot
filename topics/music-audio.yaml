  papers:
    - title: "MusicLM: Generating Music From Text"
      year: "2023"
      org: "Google Research"
      url: "https://arxiv.org/abs/2301.11325"
      note: "文本到音乐奠基"
    - title: "MusicGen: Simple and Controllable Music Generation"
      year: "2023"
      org: "Meta (NeurIPS)"
      url: "https://arxiv.org/abs/2306.05284"
      note: "可控音乐生成"
    - title: "Music Source Separation in the Waveform Domain (Demucs)"
      year: "2019"
      org: "Meta"
      url: "https://arxiv.org/abs/1911.13254"
      note: "波形域音源分离"
  projects:
    - name: "facebookresearch/audiocraft"
      url: "https://github.com/facebookresearch/audiocraft"
      note: "MusicGen / AudioGen 工具链"
    - name: "facebookresearch/demucs"
      url: "https://github.com/facebookresearch/demucs"
      note: "SOTA 音源分离"
    - name: "deezer/spleeter"
      url: "https://github.com/deezer/spleeter"
