name: embodied-manipulation
title: 具身智能·灵巧操作（Dexterous Manipulation & Grasping）
description: 具身智能细节方向——机器人操作前沿：灵巧手与多指操作、抓取、接触丰富任务、模仿学习与扩散策略、触觉与力感知、双臂协同。
keywords:
  - dexterous manipulation
  - grasping
  - in-hand manipulation
  - contact-rich manipulation
  - imitation learning
  - diffusion policy
  - action chunking
  - tactile sensing
  - bimanual manipulation
  - sim2real manipulation
  - ACT
  - ALOHA
venues:
  - RSS
  - CoRL
  - ICRA
  - IROS
  - T-RO
seed_queries:
  - "dexterous in-hand manipulation learning 2025"
  - "diffusion policy manipulation 2025 RSS CoRL"
  - "bimanual manipulation ALOHA ACT 2024 2025"
  - "tactile sensing contact-rich manipulation 2025"
  - "grasp synthesis deep learning 2025 benchmark"
  - "sim2real dexterous manipulation 2025"
  - "机器人 灵巧操作 抓取 模仿学习 2025"
seed_resources:
  papers:
    - title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
      year: "2023"
      org: "RSS"
      url: "https://arxiv.org/abs/2303.04137"
      note: "扩散策略奠基"
    - title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (ACT/ALOHA)"
      year: "2023"
      org: "RSS"
      url: "https://arxiv.org/abs/2304.13705"
      note: "双臂精细操作"
    - title: "QT-Opt: Scalable Deep Reinforcement Learning for Vision-Based Robotic Manipulation"
