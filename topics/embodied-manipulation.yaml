      note: "扩散策略官方实现"
    - name: "tonyzhaozh/aloha"
      url: "https://github.com/tonyzhaozh/aloha"
      note: "ALOHA / ACT 代码"
    - name: "huggingface/lerobot"
      url: "https://github.com/huggingface/lerobot"
