      note: "22 种本体、100 万+ episodes"
    - name: "DROID"
      url: "https://droid-dataset.github.io/"
      note: "分布式真机操作数据集"
    - name: "BridgeData V2"
      url: "https://rail-berkeley.github.io/bridgedata/"
      note: "多场景桌面操作"
    - name: "LIBERO"
      url: "https://libero-project.github.io/"
      note: "终身学习操作基准"
    - name: "SimplerEnv"
      url: "https://simpler-env.github.io/"
      note: "仿真复现真机策略评测"
