name: vla
title: Vision-Language-Action (VLA) 基础模型
description: 追踪视觉-语言-动作模型的前沿进展、经典奠基工作、开源项目与数据集，聚焦跨本体泛化与真机部署。
keywords:
  - vision-language-action
  - VLA
  - robot foundation model
  - robot policy
  - cross-embodiment
  - action tokenization
  - diffusion policy
  - flow matching policy
venues:
  - CoRL
  - RSS
  - ICRA
  - IROS
  - NeurIPS
  - ICLR
  - CVPR
  - "arXiv cs.RO"
seed_queries:
  - "vision-language-action model survey 2025"
  - "VLA robot policy cross-embodiment generalization"
  - "robot foundation model real-world deployment 2025"
  - "diffusion policy vs flow matching robot manipulation"
  - "open source VLA model fine-tuning benchmark"
  - "VLA evaluation benchmark real robot success rate"
  - "视觉语言动作模型 综述 2025"
  - "VLA 大模型 机器人 泛化"
seed_resources:
  papers:
    - title: "RT-1: Robotics Transformer for Real-World Control at Scale"
      year: "2022"
      org: "Google Research"
      url: "https://arxiv.org/abs/2212.06817"
      note: "大规模真机 Transformer 模仿学习"
    - title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control"
      year: "2023"
      org: "Google DeepMind"
      url: "https://arxiv.org/abs/2307.15818"
      note: "VLM 直接输出动作 token，涌现泛化"
    - title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models"
      year: "2023"
      org: "Open X-Embodiment Collaboration"
      url: "https://arxiv.org/abs/2310.08864"
      note: "跨本体大规模数据集与 RT-X"
    - title: "Octo: An Open-Source Generalist Robot Policy"
      year: "2024"
      org: "UC Berkeley"
      url: "https://arxiv.org/abs/2405.12213"
      note: "开源通用策略，灵活观测/动作头"
    - title: "OpenVLA: An Open-Source Vision-Language-Action Model"
      year: "2024"
      org: "Stanford et al."
      url: "https://arxiv.org/abs/2406.09246"
      note: "7B 开源 VLA，广泛用作基线"
    - title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
      year: "2023"
      org: "Columbia / Toyota"
      url: "https://arxiv.org/abs/2303.04137"
      note: "扩散式动作生成范式"
    - title: "π0: A Vision-Language-Action Flow Model for General Robot Control"
      year: "2024"
      org: "Physical Intelligence"
      url: "https://arxiv.org/abs/2410.24164"
      note: "flow matching 动作专家，跨本体"
    - title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (ACT/ALOHA)"
      year: "2023"
      org: "Stanford"
      url: "https://arxiv.org/abs/2304.13705"
      note: "低成本双臂遥操作 + ACT"
  projects:
    - name: "openvla/openvla"
      url: "https://github.com/openvla/openvla"
      note: "OpenVLA 官方实现与权重"
    - name: "octo-models/octo"
      url: "https://github.com/octo-models/octo"
      note: "Octo 通用策略"
    - name: "Physical-Intelligence/openpi"
      url: "https://github.com/Physical-Intelligence/openpi"
      note: "π0 系列开源实现"
    - name: "tonyzhaozh/aloha"
      url: "https://github.com/tonyzhaozh/aloha"
      note: "ALOHA / ACT 硬件与代码"
    - name: "real-stanford/diffusion_policy"
      url: "https://github.com/real-stanford/diffusion_policy"
      note: "Diffusion Policy 官方实现"
