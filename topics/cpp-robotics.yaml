name: cpp-robotics
title: C++ 机器人工程与实时系统
description: 追踪机器人领域 C++ 生态（Eigen/Sophus/Ceres/Pinocchio 等）、实时实践、构建/包管理与性能工程的前沿与最佳实践。
keywords:
  - C++ robotics
  - Eigen
  - Sophus
  - Ceres Solver
  - GTSAM
  - Pinocchio
  - real-time C++
  - CMake
  - Conan
  - vcpkg
  - pybind11
  - clang-tidy
venues:
  - ICRA
  - IROS
  - ROSCon
  - CppCon
  - "arXiv cs.RO"
seed_queries:
  - "real-time C++ robotics best practices 2025"
  - "Eigen optimization performance robotics 2025"
  - "Ceres Solver vs GTSAM factor graph 2025"
  - "Pinocchio rigid body dynamics C++ 2025"
  - "pybind11 robotics C++ python binding 2025"
  - "C++20 robotics modules 2025"
  - "机器人 C++ 实时 性能优化"
seed_resources:
  papers:
    - title: "Sophus: C++ Lie group library (documentation)"
      year: "ongoing"
      org: "strasdat"
      url: "https://github.com/strasdat/Sophus"
      note: "SO(3)/SE(3) 李群运算"
