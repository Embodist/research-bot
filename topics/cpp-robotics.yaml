      year: "ongoing"
      org: "Google"
      url: "http://ceres-solver.org/"
      note: "标定、BA、IK 常用"
    - title: "GTSAM: factor graphs for robotics"
      year: "ongoing"
      org: "Georgia Tech"
      url: "https://gtsam.org/"
      note: "SLAM / 状态估计"
