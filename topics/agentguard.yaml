name: agentguard
title: AgentGuard（LLM 护栏与 Agent 安全）
description: 追踪大模型安全与 Agent 护栏的前沿——直接/间接提示注入、越狱与模型拒答、工具调用与 MCP 滥用、过度代理与权限提升、数据外泄、LLM firewall 与输入输出过滤、沙箱与最小权限、人在回路审批，以及 Agent 安全评测与红队基准（AgentDojo / InjecAgent / AgentHarm）、框架（Guardrails AI / NeMo Guardrails / PurpleLlama / LLM Guard）与合规基线（OWASP LLM Top 10 / Agentic AI、NIST AI RMF、MITRE ATLAS）。
keywords:
  - prompt injection
  - indirect prompt injection
  - jailbreak
  - guardrails
  - LLM firewall
  - input output filtering
  - agent security
  - tool use risk
  - excessive agency
  - model context protocol
  - MCP security
  - sandboxing
  - least privilege
  - human in the loop
  - data exfiltration
  - red teaming
  - agent safety benchmark
  - model refusal
  - content moderation
  - AI red team
venues:
  - USENIX Security
  - IEEE S&P (Oakland)
  - ACM CCS
  - NDSS
  - NeurIPS (Datasets & Benchmarks / Safety)
  - ICLR
  - ACL (Safety)
  - SOUPS
  - Black Hat
  - DEF CON
