name: cybersecurity
title: 网络安全（Cybersecurity）
description: 追踪应用/系统/供应链与新兴 AI 安全的攻防前沿——漏洞与利用、模糊测试与程序分析、密码学工程、大模型/Agent 安全（提示注入、越狱、数据外泄）、软件供应链（SBOM）与恶意软件分析。
keywords:
  - vulnerability
  - CVE
  - fuzzing
  - exploit
  - binary analysis
  - symbolic execution
  - supply chain security
  - SBOM
  - prompt injection
  - LLM security
  - jailbreak
  - malware
  - post-quantum cryptography
  - CTF
venues:
  - USENIX Security
  - IEEE S&P (Oakland)
  - ACM CCS
  - NDSS
  - Black Hat
  - DEF CON
seed_queries:
  - "large language model agent prompt injection defense 2025 survey"
  - "coverage-guided fuzzing 2025 USENIX Security"
  - "software supply chain security SBOM attack 2025"
  - "binary analysis symbolic execution survey 2024 2025"
  - "LLM jailbreak and guardrail defense 2025"
  - "memory safety Rust C++ vulnerabilities 2025"
  - "post-quantum cryptography migration 2025"
  - "网络安全 大模型 提示注入 供应链 2025"
seed_resources:
  papers:
    - title: "OWASP Top 10 (Web & LLM Applications)"
      year: "2021/2025"
      org: "OWASP"
      url: "https://owasp.org/www-project-top-ten/"
      note: "Web 与 LLM 应用风险基线清单"
    - title: "Inferring Fine-grained Control Flow Inside SGX Enclaves with Branch Shadowing"
      year: "2017"
      org: "USENIX Security"
      url: "https://www.usenix.org/conference/usenixsecurity17"
      note: "侧信道经典（示例性 A 级来源）"
    - title: "CWE (Common Weakness Enumeration)"
      year: "ongoing"
      org: "MITRE"
      url: "https://cwe.mitre.org/"
      note: "弱点分类标准"
  projects:
    - name: "google/AFLplusplus"
      url: "https://github.com/AFLplusplus/AFLplusplus"
      note: "覆盖率引导模糊测试"
    - name: "google/oss-fuzz"
      url: "https://github.com/google/oss-fuzz"
      note: "持续模糊测试基础设施"
    - name: "angr/angr"
      url: "https://github.com/angr/angr"
      note: "二进制符号执行框架"
    - name: "trailofbits/semgrep"
      url: "https://github.com/semgrep/semgrep"
      note: "静态分析（SAST）"
    - name: "sigstore/sigstore"
      url: "https://github.com/sigstore/sigstore"
      note: "软件供应链签名"
  datasets:
    - name: "NVD / CVE"
      url: "https://nvd.nist.gov/"
      note: "漏洞数据库"
    - name: "CWE / CWE Top 25"
      url: "https://cwe.mitre.org/top25/"
      note: "弱点排行"
    - name: "Big-Vul / CVEfixes"
      url: "https://github.com/secureIT-project/CVEfixes"
      note: "漏洞修复数据集"
sections:
  - "摘要（Executive Summary）"
  - "一、关键前沿进展（近 1–2 年）"
  - "二、Web / 系统 / 供应链攻防"
  - "三、模糊测试与程序分析"
