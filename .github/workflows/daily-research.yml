name: Daily Research

# Runs the headless deep-research pipeline, commits the new reports back to the
# repo and (optionally) emails the digest. Configure the LLM + SMTP secrets in
# Settings -> Secrets and variables -> Actions. See docs/github-actions.md.

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai. Adjust to taste.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic name (e.g. vla, cybersecurity, music-audio, embodied-manipulation) or 'all'"
        default: "all"
        required: false
      depth:
        description: "Research depth"
        type: choice
        options: [quick, standard, deep]
        default: standard
      send_email:
        description: "Send the report by email"
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Run inside the prebuilt base image (Python + deps baked in), so the job
    # skips setup-python and the dependency install. Rebuilt by image.yml.
    container:
      image: ghcr.io/embodist/research-bot-base:py3.12
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Container jobs default to `sh` (no bash arrays) and start outside the
    # checkout, so pin the working directory and keep every script POSIX-only.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      TOPIC: ${{ github.event.inputs.topic || 'all' }}
      DEPTH: ${{ github.event.inputs.depth || 'standard' }}
      SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
      # --- LLM ---
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      # --- Search ---
      SEARXNG_URL: ${{ vars.SEARXNG_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --- Email ---
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      # Merge all topics of a scheduled run into a single email.
      EMAIL_DIGEST: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The engine works without the deer-flow submodule (skills fall back to
          # the local set), and skipping it keeps the daily job fast and robust.
          submodules: false
          fetch-depth: 0

      # Python + deps are already in the base image; only the editable install of
      # the checked-out code is needed, and --no-build-isolation keeps it offline
      # (hatchling is baked in).
      - name: Install research-bot
        run: pip install -e . --no-deps --no-build-isolation

      - name: Preflight (rb doctor)
        continue-on-error: true
        run: rb doctor

      - name: Run deep research
        run: |
          set -eu
          if [ "${SEND_EMAIL}" = "true" ]; then
            set -- --topic "$TOPIC" --depth "$DEPTH" --email
          else
            set -- --topic "$TOPIC" --depth "$DEPTH"
          fi
          echo "rb run $*"
          rb run "$@"

      - name: Commit reports
        if: always()
        run: |
          set -eu
          # Inside the container the checkout is owned by the runner uid, so git
          # refuses to operate on it ("not in a git directory") until trusted.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            git commit -m "chore(report): daily research $(date -u +%F)"
            # The job runs for minutes; main may have moved (a manual push, or a
            # concurrent run). Rebase our report commit onto the latest before pushing.
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report-${{ github.run_number }}
          path: |
            report/**/*.md
            report/**/*.json
            report/push-log.jsonl
          if-no-files-found: warn
          retention-days: 30
