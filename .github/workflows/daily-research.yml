name: Daily Watch

# The daily schedule runs ONLY the incremental watch (path2): one `rb run --watch`
# per configured domain, which emails just the new/changed items (KB dedup).
# One-off runs — `research` (survey a topic) and `knowledge` (build a domain map,
# i.e. the "initial") — are NOT scheduled; trigger them on demand via
# workflow_dispatch. Configure the LLM + SMTP secrets in Settings -> Secrets and
# variables -> Actions. See docs/github-actions.md.

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai. Adjust to taste.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (research uses 'topic'; knowledge/watch use 'query')"
        type: choice
        options: [research, knowledge, watch]
        default: research
      topic:
        description: "Topic name (mode=research; e.g. vla, cybersecurity, music-audio) or 'all'"
        default: "all"
        required: false
      query:
        description: "Free-text query (mode=knowledge|watch)"
        default: ""
        required: false
      depth:
        description: "Research depth"
        type: choice
        options: [quick, standard, deep]
        default: standard
      send_email:
        description: "Send the report by email"
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Run inside the prebuilt base image (Python + deps baked in), so the job
    # skips setup-python and the dependency install. Rebuilt by image.yml.
    container:
      image: ghcr.io/embodist/research-bot-base:py3.12
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Container jobs default to `sh` (no bash arrays) and start outside the
    # checkout, so pin the working directory and keep every script POSIX-only.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      MODE: ${{ github.event.inputs.mode || 'research' }}
      TOPIC: ${{ github.event.inputs.topic || 'all' }}
      QUERY: ${{ github.event.inputs.query || '' }}
      DEPTH: ${{ github.event.inputs.depth || 'standard' }}
      SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
      # --- LLM ---
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      # --- Search ---
      SEARXNG_URL: ${{ vars.SEARXNG_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --- Email ---
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      # Merge all topics of a scheduled run into a single email.
      EMAIL_DIGEST: "true"
      # --- Watch (daily increments; the ONLY scheduled work) ---
      # Converged to the project's fast-moving frontiers: the embodied/robotics
      # core (Embodied AI · VLA · robotics) plus three governance-related frontiers
      # from the intelligence-governance blueprint (value alignment, agent
      # evaluation & safety, AI governance). Newline- or comma-separated; keep
      # entries free of ASCII commas. The repo Variable `WATCH_QUERIES` overrides.
      WATCH_QUERIES: ${{ vars.WATCH_QUERIES || '具身智能与视觉-语言-动作（VLA）前沿,机器人操作与世界模型,机器人运动学、控制与 ROS 2,价值对齐与可扩展监督（含校准与不确定性）,Agent 评测与安全（能力基准、欺骗与可纠正性）,AI 治理与监管（政策、法规与标准）' }}
      WATCH_DEPTH: ${{ vars.WATCH_DEPTH || 'quick' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The engine works without the deer-flow submodule (skills fall back to
          # the local set), and skipping it keeps the daily job fast and robust.
          submodules: false
          fetch-depth: 0

      # Python + deps are already in the base image; only the editable install of
      # the checked-out code is needed, and --no-build-isolation keeps it offline
      # (hatchling is baked in).
      - name: Install research-bot
        run: pip install -e . --no-deps --no-build-isolation

      # Persist the SQLite knowledge base between runs so watch increments and
      # push dedup work across days. Restores the newest cache and saves a fresh
      # one each run (unique key + prefix restore).
      - name: Restore knowledge base
        uses: actions/cache@v4
        with:
          path: report/knowledge.db
          key: kb-${{ github.run_id }}
          restore-keys: |
            kb-

      - name: Preflight (rb doctor)
        continue-on-error: true
        run: rb doctor

      # On-demand runs (research / knowledge / watch) are dispatch-only; the
      # daily schedule is reserved for the incremental watch step below.
      - name: Run on-demand pipeline
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          if [ "${MODE}" = "research" ]; then
            set -- --topic "$TOPIC" --depth "$DEPTH" --kb
          else
            if [ -z "${QUERY}" ]; then
              echo "mode=${MODE} requires a 'query' input" >&2
              exit 1
            fi
            set -- --"${MODE}" --query "$QUERY" --depth "$DEPTH" --kb
          fi
          if [ "${SEND_EMAIL}" = "true" ]; then
            set -- "$@" --email
          fi
          echo "rb run $*"
          rb run "$@"

      # path2: incremental watch. One `rb run --watch` per configured query.
      # `--kb` enables dedup: an unchanged run is recorded but not re-emailed.
      # Only on the schedule, so a manual dispatch runs exactly what was asked.
      - name: Run watch increments
        if: ${{ github.event_name == 'schedule' && env.WATCH_QUERIES != '' }}
        run: |
          set -eu
          printf '%s\n' "$WATCH_QUERIES" | tr ',' '\n' | while IFS= read -r q; do
            q=$(printf '%s' "$q" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$q" ] && continue
            echo "watch: $q"
            rb run --watch --query "$q" --depth "$WATCH_DEPTH" --kb --email
          done

      - name: Commit reports
        if: always()
        run: |
          set -eu
          # Inside the container the checkout is owned by the runner uid, so git
          # refuses to operate on it ("not in a git directory") until trusted.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          if git diff --cached --quiet; then
            echo "no report changes to commit"
          else
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              msg="chore(report): daily watch $(date -u +%F)"
            else
              msg="chore(report): manual ${MODE} $(date -u +%F)"
            fi
            git commit -m "$msg"
            # The job runs for minutes; main may have moved (a manual push, or a
            # concurrent run). Rebase our report commit onto the latest before pushing.
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report-${{ github.run_number }}
          path: |
            report/**/*.md
            report/**/*.json
            report/push-log.jsonl
          if-no-files-found: warn
          retention-days: 30
