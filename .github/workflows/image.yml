name: Base image

# Builds and publishes the research-bot base image to GHCR. Rebuilds only when
# the Dockerfile or the dependency set changes — not on ordinary code edits.
# The daily workflow runs inside this image (see daily-research.yml).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: GHCR image names must be lowercase; github.repository_owner is
      # "Embodist", so the owner is hardcoded lowercase here on purpose.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/embodist/research-bot-base:py3.12
            ghcr.io/embodist/research-bot-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
